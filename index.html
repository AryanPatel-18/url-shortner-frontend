<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Seamless Pre-boot Redirect Script -->
    <script>
      (async function() {
        const path = window.location.pathname;
        if (/^\/[a-zA-Z0-9_-]{1,20}$/.test(path)) {
          // Hide the screen instantly so user sees nothing during the microsecond delay
          document.documentElement.style.opacity = '0';
          
          try {
            const apiBase = "https://api.urlzs.xyz";
            const shortCode = path.slice(1);
            const res = await fetch(`${apiBase}/api/v1/redirect/${encodeURIComponent(shortCode)}`, {
              headers: { 'Accept': 'application/json' }
            });
            
            if (res.ok) {
              const data = await res.json();
              if (data && data.originalUrl) {
                // Validate security
                const parsed = new URL(data.originalUrl);
                if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                  window.location.replace(data.originalUrl);
                  return; // Stop execution, redirecting...
                }
              }
            }
          } catch (e) {
            // Silently fail network errors and let React boot up to show a proper error screen
          }
          
          // If we reach here, the redirect failed (404, bad link, etc). 
          // Unhide the screen and let React handle the nice error UI!
          document.documentElement.style.opacity = '';
        }
      })();
    </script>

    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="URLZS — simple, focused URL shortening." />
    <title>URLZS — Simple URL shortening</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('urlzs.theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const isDark = savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark ? '#07111f' : '#f8fafc')
      })()
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              ink: '#172033',
              brand: '#2563eb',
              surface: '#f8fafc',
              night: '#07111f',
              panel: '#0d1b2a',
              line: '#1e3348'
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
