<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Seamless Pre-boot Redirect Script -->
    <script>
      (async function() {
        var KNOWN = ['/','home','login','register','forgot-password','reset-password','dashboard'];
        var path = window.location.pathname.replace(/\/+$/, '') || '/';
        // Skip known frontend routes
        if (path === '/' || KNOWN.indexOf(path.slice(1)) !== -1) return;
        // Only proceed for single-segment alphanumeric paths (short codes)
        if (!/^\/[a-zA-Z0-9_-]{1,20}$/.test(path)) return;

        document.documentElement.style.opacity = '0';
        try {
          var res = await fetch('https://api.urlzs.xyz/api/v1/redirect/' + encodeURIComponent(path.slice(1)), {
            headers: { 'Accept': 'application/json' }
          });
          if (res.ok) {
            var data = await res.json();
            if (data && data.originalUrl) {
              var u = new URL(data.originalUrl);
              if (u.protocol === 'http:' || u.protocol === 'https:') {
                window.location.replace(data.originalUrl);
                return;
              }
            }
          }
        } catch (e) {}
        document.documentElement.style.opacity = '';
      })();
    </script>

    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="URLZS — simple, focused URL shortening." />
    <title>URLZS — Simple URL shortening</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('urlzs.theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const isDark = savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark ? '#07111f' : '#f8fafc')
      })()
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              ink: '#172033',
              brand: '#2563eb',
              surface: '#f8fafc',
              night: '#07111f',
              panel: '#0d1b2a',
              line: '#1e3348'
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
